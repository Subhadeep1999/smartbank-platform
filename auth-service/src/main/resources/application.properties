spring.application.name=${APP_NAME:auth-service}

server.port=${SERVER_PORT:8083}

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartbank_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ==========================================
# PostgreSQL Schema
# ==========================================
spring.jpa.properties.hibernate.default_schema=${AUTH_SCHEMA:auth_schema}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

#==========================================
# JWT Configuration
#==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:smartbank-auth-service}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}

# Enable histogram buckets for HTTP request latency
management.metrics.distribution.percentiles-histogram.http.server.requests=${METRICS_HTTP_LATENCY_HISTOGRAM:true}
