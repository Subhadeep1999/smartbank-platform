spring.application.name=account-service

server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartbank_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Account schema
spring.jpa.properties.hibernate.default_schema=account_schema

# Customer Service
customer-service.base-url=http://localhost:8081

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.customerService.register-health-indicator=true
resilience4j.circuitbreaker.instances.customerService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=5
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j Retry
resilience4j.retry.instances.customerService.max-attempts=3
resilience4j.retry.instances.customerService.wait-duration=500ms

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.accountApi.limit-for-period=100
resilience4j.ratelimiter.instances.accountApi.limit-refresh-period=10s
resilience4j.ratelimiter.instances.accountApi.timeout-duration=0

# Resilience4j Bulkhead
resilience4j.bulkhead.instances.customerService.max-concurrent-calls=50
resilience4j.bulkhead.instances.customerService.max-wait-duration=0

# Resilience4j Timeout
resilience4j.timelimiter.instances.customerService.timeout-duration=2s
resilience4j.timelimiter.instances.customerService.cancel-running-future=true


# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Application Info
info.app.name=SmartBank Account Service
info.app.description=Account management microservice
info.app.version=1.0.0