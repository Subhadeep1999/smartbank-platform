spring.application.name=${APP_NAME:account-service}

server.port=${SERVER_PORT:8082}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartbank_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Account schema
spring.jpa.properties.hibernate.default_schema=${ACCOUNT_SCHEMA:account_schema}

# Customer Service
customer-service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.customerService.register-health-indicator=${CB_REGISTER_HEALTH_INDICATOR:true}
resilience4j.circuitbreaker.instances.customerService.sliding-window-type=${CB_SLIDING_WINDOW_TYPE:COUNT_BASED}
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:5}
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=${CB_MIN_CALLS:3}
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=${CB_WAIT_OPEN_STATE:10s}
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=${CB_HALF_OPEN_CALLS:2}

# Resilience4j Retry
resilience4j.retry.instances.customerService.max-attempts=${RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.customerService.wait-duration=${RETRY_WAIT_DURATION:500ms}

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.accountApi.limit-for-period=${RATE_LIMIT_PER_PERIOD:100}
resilience4j.ratelimiter.instances.accountApi.limit-refresh-period=${RATE_LIMIT_REFRESH_PERIOD:10s}
resilience4j.ratelimiter.instances.accountApi.timeout-duration=${RATE_LIMIT_TIMEOUT:0}

# Resilience4j Bulkhead
resilience4j.bulkhead.instances.customerService.max-concurrent-calls=${BULKHEAD_MAX_CONCURRENT_CALLS:50}
resilience4j.bulkhead.instances.customerService.max-wait-duration=${BULKHEAD_MAX_WAIT_DURATION:0}

# Resilience4j Timeout
resilience4j.timelimiter.instances.customerService.timeout-duration=${TIMEOUT_DURATION:2s}
resilience4j.timelimiter.instances.customerService.cancel-running-future=${TIMEOUT_CANCEL_RUNNING:true}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}

# Enable histogram buckets for HTTP request latency
management.metrics.distribution.percentiles-histogram.http.server.requests=${METRICS_HTTP_LATENCY_HISTOGRAM:true}

# Application Info
info.app.name=${INFO_APP_NAME:SmartBank Account Service}
info.app.description=${INFO_APP_DESCRIPTION:Account management microservice}
info.app.version=${INFO_APP_VERSION:1.0.0}