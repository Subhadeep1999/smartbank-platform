spring.application.name=${APP_NAME:transaction-service}

server.port=${SERVER_PORT:8084}

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartbank_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ==========================================
# PostgreSQL Schema
# ==========================================
spring.jpa.properties.hibernate.default_schema=${TRANSACTION_SCHEMA:transaction_schema}

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}

# Enable histogram buckets for HTTP request latency
management.metrics.distribution.percentiles-histogram.http.server.requests=${METRICS_HTTP_LATENCY_HISTOGRAM:true}

# =========================
# Kafka
# =========================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
spring.kafka.producer.value-serializer=${KAFKA_PRODUCER_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=${KAFKA_PRODUCER_ADD_TYPE_HEADERS:false}

# Consumer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:transaction-audit-consumer}
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.value-deserializer=${KAFKA_CONSUMER_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}

#Needed for JsonDeserializer to work properly, otherwise it will throw an exception
#spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartbank.transaction.event
#spring.kafka.consumer.properties.spring.json.value.default.type=com.smartbank.transaction.event.TransactionCreatedEvent
#spring.kafka.consumer.properties.spring.json.use.type.headers=false

# =========================
# Outbox
# =========================

outbox.publisher.fixed-delay-ms=${OUTBOX_FIXED_DELAY_MS:5000}
outbox.publisher.max-retries=${OUTBOX_MAX_RETRIES:3}